version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "terraform"
    directories:
      - "/modules/secure-s3-bucket"
      - "/examples/secure-s3-bucket"
    schedule:
      interval: "weekly"
      day: "monday"
