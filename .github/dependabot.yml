version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # * is one path segment, so each new modules/<name> or examples/<name>
  # is covered without editing this file. It does not match tests/ underneath
  # a module, and it does not match products/ (no Terraform there yet).
  - package-ecosystem: "terraform"
    directories:
      - "/modules/*"
      - "/examples/*"
    schedule:
      interval: "weekly"
      day: "monday"
