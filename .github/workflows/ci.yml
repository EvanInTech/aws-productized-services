name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # A directory under modules/ or examples/ is a matrix entry when a .tf file
  # sits directly in that directory. A new module or example is checked without
  # editing this file.
  discover:
    name: Discover Terraform directories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the Terraform matrix
        id: matrix
        run: |
          set -euo pipefail
          shopt -s nullglob
          rows=()
          while IFS= read -r -d '' dir; do
            tf=( "$dir"/*.tf )
            if [ "${#tf[@]}" -eq 0 ]; then
              continue
            fi
            rows+=("$(jq -nc --arg directory "$dir" '{directory:$directory}')")
          done < <(find modules examples -mindepth 1 -type d \
            -not -path '*/.terraform' -not -path '*/.terraform/*' \
            -print0 | sort -z)
          if [ "${#rows[@]}" -eq 0 ]; then
            echo "No Terraform directories found under modules/ or examples/."
            exit 1
          fi
          matrix="$(printf '%s\n' "${rows[@]}" | jq -sc '{include: .}')"
          {
            echo "matrix<<EOF"
            echo "${matrix}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "Discovered Terraform directories:"
          echo "${matrix}" | jq -r '.include[].directory'

  terraform:
    name: Terraform Checks (${{ matrix.directory }})
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform Format
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

      - name: Terraform Test
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(./*.tftest.hcl ./tests/*.tftest.hcl)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No .tftest.hcl files; skipping terraform test."
            exit 0
          fi
          terraform test

  # Terraform in this repo lives under modules/ and examples/.
  # security-events: write is only for the SARIF upload on this job.
  iac-security:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan modules and examples for HIGH and CRITICAL misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          skip-dirs: .git,docs,products,.github
          cache: "false"
          version: v0.70.0

      - name: Write SARIF report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
          skip-dirs: .git,docs,products,.github
          cache: "false"
          version: v0.70.0

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac

  # Rego over Terraform HCL. Checkout needs contents: read; Conftest does not
  # call AWS and does not upload anything, so this job adds no token scopes.
  policy:
    name: Policy as Code
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Conftest
        run: |
          set -euo pipefail
          version="0.71.1"
          checksum="c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985"
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "Pinned Conftest ${version} checksum is for linux/amd64."
            exit 1
          fi
          archive="conftest_${version}_Linux_x86_64.tar.gz"
          workdir="${RUNNER_TEMP:-/tmp}/conftest"
          mkdir -p "${workdir}/bin"
          curl -fsSL -o "${workdir}/${archive}" "https://github.com/open-policy-agent/conftest/releases/download/v${version}/${archive}"
          echo "${checksum}  ${workdir}/${archive}" | sha256sum -c -
          tar -xzf "${workdir}/${archive}" -C "${workdir}/bin" conftest
          echo "${workdir}/bin" >> "${GITHUB_PATH}"
          "${workdir}/bin/conftest" --version

      - name: Evaluate policies against modules and examples
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find modules examples -type f -name '*.tf' -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Terraform files found under modules/ or examples/."
            exit 1
          fi
          conftest test --parser hcl2 --no-color --policy policy/terraform "${files[@]}"

      - name: Unit-test the policies
        run: conftest verify --policy policy/terraform --show-builtin-errors

      - name: Insecure fixture must be rejected
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP:-/tmp}/conftest-insecure.json"
          set +e
          conftest test --parser hcl2 --no-color --policy policy/terraform --output json policy/tests/insecure_s3_bucket.tf >"${output}"
          status=$?
          set -e
          cat "${output}"
          if [ "${status}" -eq 0 ]; then
            echo "expected policy/tests/insecure_s3_bucket.tf to be rejected"
            exit 1
          fi
          if [ "${status}" -ne 1 ]; then
            echo "conftest exited ${status}; expected 1 when the insecure fixture has violations"
            exit 1
          fi
          jq -e --argjson rules '["S3-ENCRYPTION:","S3-PUBLIC-ACCESS-BLOCK:","S3-VERSIONING:"]' '
            [.[].failures[].msg] as $msgs
            | all($rules[]; . as $rule | any($msgs[]; startswith($rule)))
          ' "${output}" >/dev/null
          echo "insecure fixture violated S3-ENCRYPTION, S3-PUBLIC-ACCESS-BLOCK, and S3-VERSIONING"

  # Source SBOM. Release-asset upload and the dependency snapshot API stay
  # off, so this job only needs contents: read to check out the tree and
  # upload the workflow artifact.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-artifact: "true"
          upload-release-assets: "false"
          dependency-snapshot: "false"
